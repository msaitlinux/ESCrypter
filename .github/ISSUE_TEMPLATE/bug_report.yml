name: Bug report / Hata bildirimi
description: Report a reproducible problem without sensitive data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md. Never include passwords or keys."
  - type: input
    id: version
    attributes:
      label: ESCrypter version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and desktop environment
      placeholder: Debian 13, amd64, KDE Plasma, Wayland
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce using synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs (optional)
      render: text
